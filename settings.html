<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Settings</title>
    </head>
    <body>
        <h1 id="headline1-id" class="headline1">Settings</h1>
        <div class="content-wrapper">
            <section id="settings-selection-id" class="settings-selection">
                <section class="settings-game-theme">
                    <h2 class="settings-game-theme__headline2">Game themes</h2>
                    <form id="settings-game-theme-form-id">
                        <label class="settings-game-theme__label"
                            ><input type="radio" value="Code vibes theme" name="game-theme" />Code vibes theme</label
                        >
                        <label class="settings-game-theme__label"
                            ><input type="radio" value="Gaming theme" name="game-theme" />Gaming theme</label
                        >
                    </form>
                </section>
                <section class="settings-player-color">
                    <h2 class="settings-player-color__headline2">Choose player</h2>
                    <form id="settings-player-color-form-id">
                        <label class="settings-player-color__label"><input type="radio" value="Blue" name="player-color" />Blue</label>
                        <label class="settings-player-color__label"><input type="radio" value="Yellow" name="player-color" />Yellow</label>
                    </form>
                </section>
                <section class="settings-board-size">
                    <h2 class="settings-board-size__headline2">Board size</h2>
                    <form id="settings-board-size-form-id">
                        <label class="settings-board-size__label"><input type="radio" value="16 cards" name="board-size" />16 cards</label>
                        <label class="settings-board-size__label"><input type="radio" value="24 cards" name="board-size" />24 cards</label>
                        <label class="settings-board-size__label"><input type="radio" value="36 cards" name="board-size" />36 cards</label>
                    </form>
                </section>
            </section>

            <section class="selected">
                <img id="preview-img-id" src="/assets/imgs/settings/theme/code-vibes-preview.png" alt="" />

                <div id="start-board-id" class="start-board">
                    <div id="start-board-game-theme-id" class="start-board__text">Game theme</div>
                    <div class="start-board__line-wrapper">
                        <div class="start-board__line"></div>
                    </div>
                    <div id="start-board-player-color-id" class="start-board__text">Player</div>
                    <div class="start-board__line-wrapper">
                        <div class="start-board__line"></div>
                    </div>
                    <div id="start-board-board-size-id" class="start-board__text">Board size</div>
                    <a id="start-board-button-id" class="start-board__button">Start</a>
                </div>
            </section>
        </div>

        <script type="module" src="src/main.ts"></script>
        <script type="module" src="src/scripts/settings.ts"></script>
    </body>
</html>
