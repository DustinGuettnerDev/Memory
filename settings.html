<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
</head>
<body>
    <h1>Settings</h1>
    <section>
        <h2 class="headline2-">Game themes</h2>
        <form>
            <label><input type="radio" value="a" name="game-theme">Code vibes theme</label>  
            <label><input type="radio" value="b" name="game-theme">Gaming theme</label>  
        </form>


        <h2>Choose player</h2>
        <form>
            <label><input type="radio" value="a" name="player-color">Blue</label>  
            <label><input type="radio" value="b" name="player-color">Yellow</label>  
        </form>
        <h2>Board size</h2>
        <form>
            <label><input type="radio" value="a" name="board-size">16 cards</label>  
            <label><input type="radio" value="b" name="board-size">24 cards</label>  
            <label><input type="radio" value="b" name="board-size">36 cards</label>  
        </form>

    </section>








    <section></section>

    <script type="module" src="src/main.ts"></script>
</body>
</html>
