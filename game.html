<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Memory - Game</title>
    </head>
    <body>
        <main class="game-page">
            <header>
                <section class="playscore">
                    <div class="playscore__blue">
                        <div class="playscore__blue-icon"></div>
                        <div class="playscore__color-name">Blue</div>
                        <div class="playscore__blue-count">1</div>
                    </div>
                    <div class="playscore__yellow">
                        <div class="playscore__yellow-icon"></div>
                        <div class="playscore__color-name">Yellow</div>
                        <div class="playscore__yellow-count">1</div>
                    </div>
                </section>

                <section class="current-player">
                    Current player:
                    <div class="current-player__icon-background">
                        <div class="current-player__icon"></div>
                    </div>
                </section>

                <button id="quit-game-button-id" class="quit-game-button">
                    <div class="quit-game-button__icon"></div>
                    Exit game
                </button>
            </header>

            <dialog id="quit-game-dialog-id" class="quit-game-dialog">
                <p class="quit-game-dialog__text">
                    Are you sure you want to quit<br />
                    the game
                </p>

                <div class="quit-game-dialog__menu">
                    <button id="back-to-game-button-id" class="quit-game-dialog__back-to-game-button">Back to game</button>
                    <a href="settings.html" class="quit-game-dialog__exit-game-link">Exit game</a>
                </div>
            </dialog>

            <section id="cardboard-id" class="cardboard"></section>
        </main>

        <script type="module" src="src/main.ts"></script>
        <script type="module" src="src/scripts/game.ts"></script>
    </body>
</html>
